pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'nbt_passthrough_demonstrator'
include ':app'
include('com.infineon.hsw.utils')
include('com.infineon.hsw.channel')
include('com.infineon.hsw.ndef')
include('com.infineon.hsw.ndef.bp')
include('com.infineon.hsw.apdu')
include('com.infineon.hsw.apdu.nbt')
project(':com.infineon.hsw.utils').projectDir = file('app/libs/optiga-nbt-lib-java/library/hsw-utils-java')
project(':com.infineon.hsw.channel').projectDir = file('app/libs/optiga-nbt-lib-java/library/hsw-channel-java')
project(':com.infineon.hsw.ndef').projectDir = file('app/libs/optiga-nbt-lib-java/library/hsw-ndef-java')
project(':com.infineon.hsw.ndef.bp').projectDir = file('app/libs/optiga-nbt-lib-java/library/hsw-ndef-bp-java')
project(':com.infineon.hsw.apdu').projectDir = file('app/libs/optiga-nbt-lib-java/library/hsw-apdu-java')
project(':com.infineon.hsw.apdu.nbt').projectDir = file('app/libs/optiga-nbt-lib-java/library/hsw-apdu-nbt-java')
